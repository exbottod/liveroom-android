<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VenderLive Panel</title>
<style>
  :root { --bg:#0b0d14; --card:#121520; --card2:#0e1019; --line:#1f2333; --ink:#e7e9f2; --muted:#8a90a6;
          --accent:#7c5cff; --accent2:#9b4dff; --ok:#33d6a6; --err:#ff6b6b; --gold:#e6b85c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font-family:inherit; cursor:pointer; }
  input,select { font-family:inherit; }
  .hidden { display:none !important; }

  /* ---------- login ---------- */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(900px 400px at 50% -10%, #1b1f3a 0%, var(--bg) 70%); }
  .box { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:26px 22px; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  .logo { width:54px; height:54px; border-radius:15px; display:grid; place-items:center; font-size:26px;
    font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .brand h1 { margin:0; font-size:19px; }
  .brand p { margin:3px 0 0; font-size:12.5px; color:var(--muted); }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
  .in { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--ink); font-size:14.5px; outline:none; }
  .in:focus { border-color:var(--accent); }
  .btn { width:100%; padding:13px; border-radius:12px; border:0; font-size:15px; font-weight:600; margin-top:14px;
    color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .btn.ghost { background:var(--card2); border:1px solid var(--line); color:var(--ink); font-weight:500; }
  .btn:disabled { opacity:.55; }
  .sep { text-align:center; color:var(--muted); font-size:12px; margin:16px 0 2px; }
  .msg { font-size:12.5px; margin-top:12px; min-height:16px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .foot { text-align:center; color:var(--muted); font-size:11.5px; margin-top:20px; }

  /* ---------- shell ---------- */
  #app { min-height:100vh; }
  .top { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:rgba(11,13,20,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .burger { width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); font-size:20px; display:grid; place-items:center; }
  .top .t { flex:1; min-width:0; }
  .top .t b { display:block; font-size:16px; }
  .top .t span { font-size:11.5px; color:var(--muted); }
  .save { padding:10px 18px; border-radius:12px; border:0; color:#fff; font-weight:600; font-size:14px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .save:disabled { opacity:.5; }
  main { max-width:820px; margin:0 auto; padding:16px 14px 80px; }

  /* ---------- side sheet ---------- */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s; }
  #scrim.on { opacity:1; pointer-events:auto; }
  #side { position:fixed; top:0; bottom:0; left:0; width:min(310px,84vw); z-index:50; background:#0d0f17;
    border-right:1px solid var(--line); transform:translateX(-102%); transition:transform .22s ease;
    display:flex; flex-direction:column; }
  #side.on { transform:none; }
  .who { display:flex; align-items:center; gap:12px; padding:18px 16px 14px; }
  .who .logo { width:42px; height:42px; font-size:20px; border-radius:12px; }
  .who b { display:block; font-size:15px; }
  .who span { font-size:11.5px; color:var(--muted); word-break:break-all; }
  nav { flex:1; overflow-y:auto; padding:6px 10px 12px; }
  .grp { font-size:10.5px; letter-spacing:.08em; color:var(--muted); padding:14px 10px 6px; text-transform:uppercase; }
  .item { width:100%; display:flex; align-items:center; gap:12px; padding:12px; margin:2px 0; border:0; border-radius:12px;
    background:transparent; color:var(--ink); font-size:14.5px; text-align:left; }
  .item .ic { width:24px; text-align:center; font-size:17px; }
  .item.on { background:#1c1840; color:#c9bdff; }
  .item.soon { color:#5f6580; }
  .item small { margin-left:auto; font-size:10px; color:#5f6580; border:1px solid var(--line); padding:2px 7px; border-radius:20px; }
  .out { margin:10px; }

  /* ---------- cards ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .card h2 { margin:0 0 4px; font-size:15px; }
  .card .hint { margin:0 0 12px; font-size:12.5px; color:var(--muted); line-height:1.55; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
  .tab { padding:9px 16px; border-radius:30px; border:1px solid var(--line); background:var(--card2);
    color:var(--muted); font-size:13px; white-space:nowrap; }
  .tab.on { color:#fff; border-color:var(--accent); background:#1c1840; }
  .pic { display:flex; align-items:center; gap:12px; margin-top:6px; }
  .pic img { width:64px; height:64px; object-fit:contain; border-radius:12px; background:var(--card2); border:1px solid var(--line); }
  .pic input[type=file] { flex:1; font-size:12px; color:var(--muted); min-width:0; }
  .badge { display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; background:#16382f; color:var(--ok); }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1d2133; border:1px solid var(--line);
    padding:12px 18px; border-radius:14px; font-size:13.5px; z-index:80; max-width:90vw; }
  .toast.ok { border-color:#1f6b57; } .toast.err { border-color:#7a2f2f; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="box">
    <div class="brand">
      <div class="logo">V</div>
      <div><h1>VenderLive Panel</h1><p>Panel developer VenderLive</p></div>
    </div>
    <label for="em">Email admin</label>
    <input id="em" class="in" type="email" placeholder="nama@email.com" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" class="in" type="password" placeholder="Password" autocomplete="current-password">
    <button id="forgot" class="btn ghost" style="padding:9px;font-size:13px;margin-top:12px">Lupa sandi?</button>
    <button id="go" class="btn">Masuk</button>
    <div class="sep">atau</div>
    <button id="goog" class="btn ghost">Masuk dengan Google</button>
    <div id="lmsg" class="msg"></div>
    <div class="foot">Hanya akun yang terdaftar yang bisa membuka panel ini.</div>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <div class="top">
    <button class="burger" id="menu" aria-label="Menu">&#9776;</button>
    <div class="t"><b id="ttl">SVIP</b><span id="sub">Dashboard / SVIP</span></div>
    <button class="save" id="save">Simpan</button>
  </div>

  <div id="scrim"></div>
  <aside id="side">
    <div class="who">
      <div class="logo">V</div>
      <div><b>VenderLive Panel</b><span id="meMail">-</span></div>
    </div>
    <nav id="nav"></nav>
    <button class="btn ghost out" id="logout">Keluar</button>
  </aside>

  <main id="view"></main>
</section>

<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider,
         sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyAn5YG1LeeICQurRn_qyQtkSgPaup_Azd8",
  authDomain: "test-app-94b28.firebaseapp.com",
  projectId: "test-app-94b28",
  storageBucket: "test-app-94b28.firebasestorage.app",
  messagingSenderId: "383929756819",
  appId: "1:383929756819:android:2a6cc966ba67730bf4f166",
});
const auth = getAuth(app), db = getFirestore(app), storage = getStorage(app);
const $ = (id) => document.getElementById(id);

/* ---------- menu: only SVIP is live for now, the rest are placeholders ---------- */
const MENU = [
  { g:"Utama", items:[ { id:"svip", ic:"👑", label:"SVIP", live:true }, { id:"dompet", ic:"👛", label:"Dompet" } ] },
  { g:"Pengguna", items:[ { id:"user", ic:"👥", label:"User", live:true }, { id:"room", ic:"🎤", label:"Room" } ] },
  { g:"Konten", items:[ { id:"gift", ic:"🎁", label:"Gift" }, { id:"banner", ic:"🖼️", label:"Frame & banner" },
                        { id:"emote", ic:"😀", label:"Emote room" } ] },
  { g:"Sistem", items:[ { id:"cs", ic:"💬", label:"Customer Service" }, { id:"log", ic:"📜", label:"Log admin" } ] },
];
let page = "svip", state = { levels: [], tab: 1, users: null, q: "" };
let dirty = false;

function toast(text, kind="ok") {
  const t = $("toast"); t.textContent = text; t.className = "toast " + kind;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add("hidden"), 3600);
}
function openSide(on) { $("side").classList.toggle("on", on); $("scrim").classList.toggle("on", on); }

function buildNav() {
  $("nav").innerHTML = MENU.map((s) => `<div class="grp">${s.g}</div>` + s.items.map((i) =>
    `<button class="item ${i.id===page?"on":""} ${i.live?"":"soon"}" data-id="${i.id}">
       <span class="ic">${i.ic}</span>${i.label}${i.live?"":"<small>segera</small>"}</button>`).join("")).join("");
  $("nav").querySelectorAll(".item").forEach((b) => b.onclick = () => go(b.dataset.id));
}
function go(id) {
  const item = MENU.flatMap((s) => s.items).find((i) => i.id === id);
  page = id; openSide(false); buildNav();
  $("ttl").textContent = item.label; $("sub").textContent = "Dashboard / " + item.label;
  $("save").classList.toggle("hidden", item.id !== "svip");
  render();
}


const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* ---------- User page: the copy of accounts kept in Firestore ---------- */
async function renderUsers() {
  const v = $("view");
  if (!state.users) {
    v.innerHTML = `<div class="card"><h2>User</h2><p class="hint">Memuat akun...</p></div>`;
    try {
      const snap = await getDocs(query(collection(db, "users"), orderBy("createdAt", "desc"), limit(300)));
      state.users = snap.docs.map((d) => ({ key: d.id, ...d.data() }));
    } catch (e) {
      v.innerHTML = `<div class="card"><h2>User</h2><p class="hint">Gagal memuat akun: ${esc(e.code === "permission-denied" ? "akun ini bukan admin." : e.message)}</p></div>`;
      return;
    }
    return renderUsers();
  }
  const q = state.q.trim().toLowerCase();
  const rows = state.users.filter((u) => !q ||
    [u.nickname, u.publicId, u.phone, u.gender].some((x) => String(x || "").toLowerCase().includes(q)));
  v.innerHTML = `<div class="card">
    <h2>User <span class="badge">${state.users.length} akun</span></h2>
    <p class="hint">Salinan akun dari database. Diperbarui otomatis setiap ada yang mendaftar, masuk, atau mengubah profil.</p>
    <input id="uq" class="in" placeholder="Cari nama, ID, atau nomor" value="${esc(state.q)}">
    <div style="margin-top:12px">
    ${rows.length ? rows.map((u) => `<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
      <div class="logo" style="width:40px;height:40px;font-size:15px;border-radius:12px;overflow:hidden">${u.avatar ? `<img src="${esc(u.avatar)}" alt="" style="width:100%;height:100%;object-fit:cover">` : esc((u.nickname || "U").slice(0,1).toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <b style="font-size:14px">${esc(u.nickname || "Tanpa nama")}</b>
        <div style="font-size:11.5px;color:var(--muted);word-break:break-word">ID ${esc(u.publicId || "-")}${u.gender ? " · " + (u.gender === "male" ? "Pria" : "Wanita") : ""}${u.phone ? " · " + esc(u.phone) : ""}</div>
      </div>
      <small style="font-size:10.5px;color:var(--muted)">${u.createdAt ? new Date(u.createdAt).toLocaleDateString("id-ID") : "-"}</small>
    </div>`).join("") : `<p class="hint">Belum ada akun yang cocok.</p>`}
    </div></div>`;
  const box = $("uq");
  box.oninput = () => {
    const caret = box.selectionStart;
    state.q = box.value; renderUsers();
    const again = $("uq"); if (again) { again.focus(); again.setSelectionRange(caret, caret); }
  };
}

/* ---------- SVIP page ---------- */
const DEFAULTS = [1,2,3,4,5,6].map((n) => ({ level:n, price:0, score:0, weeklyCoins:0, medalUrl:"", labelUrl:"", frameUrl:"" }));

async function loadSvip() {
  const snap = await getDoc(doc(db, "pub", "svip"));
  const levels = snap.exists() && Array.isArray(snap.data().levels) && snap.data().levels.length
    ? snap.data().levels : DEFAULTS;
  state.levels = levels.map((l) => ({ ...l }));
  if (!state.levels.find((l) => l.level === state.tab)) state.tab = state.levels[0].level;
}

function render() {
  const v = $("view");
  if (page === "user") { renderUsers(); return; }
  if (page !== "svip") {
    const item = MENU.flatMap((s) => s.items).find((i) => i.id === page);
    v.innerHTML = `<div class="card"><h2>${item.label}</h2><p class="hint">Halaman ini segera hadir. Untuk sekarang yang aktif baru panel SVIP.</p></div>`;
    return;
  }
  const t = state.levels.find((l) => l.level === state.tab);
  v.innerHTML = `
    <div class="tabs">${state.levels.map((l) => `<button class="tab ${l.level===state.tab?"on":""}" data-l="${l.level}">SVIP${l.level}</button>`).join("")}</div>
    <div class="card">
      <h2>SVIP${t.level} <span class="badge">aktif</span></h2>
      <p class="hint">Harga, poin naik level, dan hadiah koin mingguan untuk level ini. Disimpan ke database dan langsung dibaca aplikasi, tanpa build ulang.</p>
      <div class="grid">
        <div><label>Harga (IDR)</label><input class="in" data-f="price" type="number" min="0" value="${t.price}"></div>
        <div><label>Poin naik level</label><input class="in" data-f="score" type="number" min="0" value="${t.score}"></div>
        <div><label>Hadiah koin mingguan</label><input class="in" data-f="weeklyCoins" type="number" min="0" value="${t.weeklyCoins}"></div>
      </div>
    </div>
    ${["medal:Medali SVIP","label:Label SVIP","frame:Bingkai avatar"].map((s) => { const [k,n]=s.split(":"); const u=t[k+"Url"];
      return `<div class="card"><h2>${n}</h2><p class="hint">Gambar PNG atau WebP transparan, ukuran bebas.</p>
        <div class="pic"><img alt="" src="${u||""}" ${u?"":'style="visibility:hidden"'}>
        <input type="file" accept="image/*" data-up="${k}"></div></div>`; }).join("")}
  `;
  v.querySelectorAll(".tab").forEach((b) => b.onclick = () => { state.tab = Number(b.dataset.l); render(); });
  v.querySelectorAll("input[data-f]").forEach((i) => i.oninput = () => { t[i.dataset.f] = Number(i.value || 0); dirty = true; });
  v.querySelectorAll("input[data-up]").forEach((i) => i.onchange = async () => {
    const file = i.files[0]; if (!file) return;
    try {
      toast("Mengunggah gambar...", "ok");
      const ext = (file.name.split(".").pop() || "png").toLowerCase();
      const r = ref(storage, `svip/lv${t.level}_${i.dataset.up}_${Date.now()}.${ext}`);
      await uploadBytes(r, file);
      t[i.dataset.up + "Url"] = await getDownloadURL(r);
      dirty = true; render(); toast("Gambar terunggah. Tekan Simpan.", "ok");
    } catch (e) { toast("Gagal unggah: " + e.message, "err"); }
  });
}

async function saveSvip() {
  const b = $("save"); b.disabled = true;
  try {
    await setDoc(doc(db, "pub", "svip"), {
      levels: state.levels.map((l) => ({ level:l.level, price:+l.price||0, score:+l.score||0, weeklyCoins:+l.weeklyCoins||0,
        medalUrl:l.medalUrl||"", labelUrl:l.labelUrl||"", frameUrl:l.frameUrl||"" })),
      updatedAt: Date.now(),
    });
    dirty = false; toast("Tersimpan. Aplikasi langsung memakai data baru.", "ok");
  } catch (e) {
    toast(e.code === "permission-denied" ? "Akun ini bukan admin, tidak boleh menyimpan." : "Gagal: " + e.message, "err");
  } finally { b.disabled = false; }
}

/* ---------- auth ---------- */
const lmsg = (t, k="err") => { $("lmsg").textContent = t; $("lmsg").className = "msg " + k; };
const AUTH_TEXT = {
  "auth/invalid-credential":"Email atau password salah.",
  "auth/invalid-email":"Format email salah.",
  "auth/user-not-found":"Akun tidak terdaftar.",
  "auth/wrong-password":"Password salah.",
  "auth/too-many-requests":"Terlalu banyak percobaan, coba lagi nanti.",
  "auth/popup-closed-by-user":"Login Google dibatalkan.",
  "auth/popup-blocked":"Browser memblokir jendela Google. Izinkan popup lalu coba lagi.",
  "auth/cancelled-popup-request":"Jendela Google sebelumnya belum ditutup.",
  "auth/network-request-failed":"Jaringan bermasalah, coba lagi.",
  "auth/operation-not-allowed":"Metode masuk ini belum diaktifkan di Firebase Console.",
  "auth/account-exists-with-different-credential":"Email ini sudah terdaftar dengan metode masuk lain.",
  "auth/unauthorized-domain":"Domain exbottod.github.io belum diizinkan di Firebase. Buka Firebase Console, Authentication, Settings, Authorized domains, lalu tambahkan exbottod.github.io. Login email dan password tetap bisa dipakai sekarang.",
  "auth/invalid-api-key":"Konfigurasi Firebase di panel salah.",
  "auth/app-not-authorized":"Aplikasi ini belum diizinkan untuk project Firebase itu.",
  "permission-denied":"Akun ini bukan admin panel.",
};
const authText = (e) => AUTH_TEXT[String(e?.code || "").replace(/^firebase:\s*/i, "")]
  || AUTH_TEXT[String(e?.code || "").toLowerCase()]
  || String(e?.message || e).replace(/^Firebase:\s*/i, "");

$("go").onclick = async () => {
  const email = $("em").value.trim(), pw = $("pw").value;
  if (!email || !pw) return lmsg("Isi email dan password.");
  $("go").disabled = true; lmsg("Masuk...", "ok");
  try { await signInWithEmailAndPassword(auth, email, pw); } catch (e) { lmsg(authText(e)); } finally { $("go").disabled = false; }
};
$("goog").onclick = async () => {
  $("goog").disabled = true; lmsg("Membuka Google...", "ok");
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    const domain = String(e?.code || "").includes("unauthorized-domain");
    lmsg(authText(e), "err");
    if (domain) {
      const box = document.createElement("div");
      box.className = "msg";
      box.style.color = "var(--muted)";
      box.textContent = "Langkah: Firebase Console, Authentication, Settings, Authorized domains, Add domain, tulis exbottod.github.io, simpan. Tunggu satu menit lalu muat ulang halaman ini.";
      $("lmsg").after(box);
    }
  } finally { $("goog").disabled = false; }
};
$("forgot").onclick = async () => {
  const email = $("em").value.trim(); if (!email) return lmsg("Isi email dulu, lalu tekan Lupa sandi.");
  try { await sendPasswordResetEmail(auth, email); lmsg("Tautan reset dikirim ke email itu.", "ok"); } catch (e) { lmsg(authText(e)); }
};
$("logout").onclick = () => signOut(auth);
$("menu").onclick = () => openSide(true);
$("scrim").onclick = () => openSide(false);
$("save").onclick = () => saveSvip();

onAuthStateChanged(auth, async (user) => {
  if (!user) { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); return; }
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("meMail").textContent = user.email || "";
  buildNav(); go("svip");
  try { await loadSvip(); render(); }
  catch (e) { toast(e.code === "permission-denied" ? "Akun ini belum diizinkan membaca data." : "Gagal memuat: " + e.message, "err"); }
});
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
