name: Android CI

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write google-services.json from secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json

      - name: Write local.properties
        run: |
          echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > local.properties
          echo "WS_URL=${{ vars.WS_URL }}" >> local.properties
          echo "AGORA_APP_ID=${{ vars.AGORA_APP_ID }}" >> local.properties

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liveroom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
